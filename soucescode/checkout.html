<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
    <link rel="stylesheet" href="checkouthtml.css">
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Checkout</h1>
        </div>

        <form>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="address">Shipping Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter your shipping address" required></textarea>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="">Select your country</option>
                    <option value="usa">United States</option>
                    <option value="canada">Canada</option>
                    <option value="uk">United Kingdom</option>
                </select>
            </div>

            <div class="form-group">
                <label for="card">Credit Card Number</label>
                <input type="text" id="card" name="card" placeholder="Enter your card number" required>
            </div>

            <div class="checkout-summary">
                <h2>Order Summary</h2>
                <p><span>Subtotal:</span> <span>$50.00</span></p>
                <p><span>Shipping:</span> <span>$5.00</span></p>
                <p class="total"><span>Total:</span> <span>$55.00</span></p>
            </div>

            <button type="submit" class="checkout-button">Place Order</button>
        </form>
    </div>
</body>
</html>
