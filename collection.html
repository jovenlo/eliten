        <div class="searchbar">
            <input placeholder="Search" id="searchInput" onkeyup="searchProducts()">

        </div>

        <div class="items" id="products-container">
            <!-- Products will be dynamically added here -->
        </div>
    </div>

    <script>
        // Load products from localStorage
        function loadProducts() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            products.forEach(product => {
                const productElement = document.createElement('div');
                productElement.className = 'item-img';
                productElement.innerHTML = `
                    <img src="${product.imageUrl}" alt="${product.name}">
                    <p>${product.name}</p>
                    <p>$${product.price.toFixed(2)}</p>
                    <buttonui onclick="window.location.href='product.html?id=${product.id}'">View Details</buttonui>
                    <buttonui onclick="addToCart('${product.name}', ${product.price}, '${product.imageUrl}')">Add To Cart</buttonui>
                    <buttonui onclick="buyNow('${product.name}', ${product.price}, '${product.imageUrl}')" class="buy-now-btn">Buy Now</buttonui>
                `;
                container.appendChild(productElement);
            });
        }

        // Search functionality
        function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) ||
                product.description.toLowerCase().includes(searchTerm)
            ).forEach(product => {
                const productElement = document.createElement('div');
                productElement.className = 'item-img';
                productElement.innerHTML = `
                    <img src="${product.imageUrl}" alt="${product.name}">
                    <p>${product.name}</p>
                    <p>$${product.price.toFixed(2)}</p>
                    <buttonui onclick="window.location.href='product.html?id=${product.id}'">View Details</buttonui>
                    <button onclick="addToCart('${product.name}', ${product.price}, '${product.imageUrl}')">Add To Cart</button>
                    <button onclick="buyNow('${product.name}', ${product.price}, '${product.imageUrl}')" class="buy-now-btn">Buy Now</button>
                `;
                container.appendChild(productElement);
            });
        }

        // Add to cart functionality
        function addToCart(name, price, image) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            // Check if item already exists in cart
            const existingItem = cart.find(item => item.name === name);
            
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                cart.push({
                    name: name,
                    price: price,
                    image: image,
                    quantity: 1
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Item added to cart!');
        }

        // Buy Now functionality
        function buyNow(name, price, image) {
            const cart = [{
                name: name,
                price: price,
                image: image,
                quantity: 1
            }];
            
            localStorage.setItem('cart', JSON.stringify(cart));
            window.location.href = 'checkout.html';
        }

        // Initialize products when page loads
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
