<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">ELITEN</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>

    <div class="collection">
        <div class="texted3">
            <h1 style="margin-left: 28%;">Collections</h1>
        </div>

        <button class="button-cart" onclick="window.location.href='cart.html'">
            <svg viewBox="0 0 16 16" class="bi bi-cart-check" height="24" width="24" xmlns="http://www.w3.org/2000/svg" fill="#fff">

        </button>

        <div class="searchbar">
            <input placeholder="Search" id="searchInput" onkeyup="searchProducts()">
        </div>

        <div class="texted3">
            <h1>Select your fashion</h1>
        </div>

        <div class="products-grid" id="products-container">
            <!-- Products will be dynamically added here -->
        </div>

    <!-- Scripts -->
