<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Eliten</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">Eliten</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="collection.html">Collection</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="nav-actions">
            <button class="nav-toggle" onclick="shownavbar()">☰</button>
            <a href="cart.html" class="cart-icon">🛒</a>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <div class="side-nav">
        <div class="side-nav-header">
            <h2>Menu</h2>
            <button class="close-btn" onclick="closenavbar()">×</button>
        </div>
        <div class="side-navbar-links">
            <a href="index.html" class="tog-navbar-link">Home</a>
            <a href="collection.html" class="tog-navbar-link">Collection</a>
            <a href="about.html" class="tog-navbar-link">About</a>
            <a href="contact.html" class="tog-navbar-link">Contact</a>
        </div>
    </div>

    <!-- Main Content -->
    <main class="checkout-container">
        <div class="checkout-form">
            <h2>Billing Information</h2>
            <form id="billing-form">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" required>
                </div>
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" required>
                </div>
            </form>
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <div id="checkout-items">
                <!-- Cart items will be dynamically added here -->
            </div>
            <div class="summary-item">
                <span>Subtotal:</span>
                <span id="checkout-subtotal">₹0.00</span>
            </div>
            <div class="summary-item">
                <span>Tax (10%):</span>
                <span id="checkout-tax">₹0.00</span>
            </div>
            <div class="summary-item">
                <span>Shipping:</span>
                <span id="shipping">₹5.99</span>
            </div>
            <div class="summary-item total">
                <span>Total:</span>
                <span id="checkout-total">₹0.00</span>
            </div>
            <button onclick="proceedToPayment()" class="payment-btn">Proceed to Payment</button>
        </div>
    </main>

    <script src="admin.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
